trigger: none

pr:
  autoCancel: true
  drafts: false
  branches:
    include:
      - main
  paths:
    include:
      - auto_round
      - auto_round_extension
      - .azure-pipelines/scripts/performance
      - .azure-pipelines/performance-test.yaml
    exclude:
      - "*.md"
      - "**/*.md"
      - auto_round_extension/ark

variables:
  CONTAINER_NAME: "AutoRoundPerfTest"

stages:
  - stage: PerformanceTest
    displayName: Performance Test
    dependsOn: []
    jobs:
      - job: PerformanceTestJob
        displayName: Performance Test Job
        pool: GAUDI

        strategy:
          matrix:
            Qwen3_W4A16:
              model_name: 'Qwen/Qwen3-0.6B'
              scheme: 'W4A16'
            Qwen3_FP8_STATIC:
              model_name: 'Qwen/Qwen3-0.6B'
              scheme: 'FP8_STATIC'

        steps:
          - script: |
              rm -fr ${BUILD_SOURCESDIRECTORY} || sudo rm -fr ${BUILD_SOURCESDIRECTORY} || true
            displayName: "Clean workspace"

          - checkout: self
            clean: true
            fetchTags: true
            displayName: "Checkout out Repo"

          - script: |
              docker pull vault.habana.ai/gaudi-docker/1.24.0/ubuntu24.04/habanalabs/pytorch-installer-2.10.0:latest
            displayName: "Pull habana docker image"

          - script: |
              docker stop $(CONTAINER_NAME)
              docker rm -vf $(CONTAINER_NAME) || true
              env | sort
            displayName: "Clean docker container"

          - task: Bash@3
            inputs:
              targetType: "inline"
              script: |
                docker run -dit --disable-content-trust --privileged --name=$(CONTAINER_NAME) --shm-size="2g" \
                  --runtime=habana -e HABANA_VISIBLE_DEVICES=all -e OMPI_MCA_btl_vader_single_copy_mechanism=none --cap-add=sys_nice --net=host --ipc=host \
                  -v ${BUILD_SOURCESDIRECTORY}:/auto-round vault.habana.ai/gaudi-docker/1.24.0/ubuntu24.04/habanalabs/pytorch-installer-2.10.0:latest
                docker exec $(CONTAINER_NAME) bash -c "ln -sf \$(which python3) /usr/bin/python"
                echo "Show the container list after docker run ... "
                docker ps -a
            displayName: "Docker run - $(CONTAINER_NAME) Container"

          - script: |
              docker exec $(CONTAINER_NAME) bash -c "cd /auto-round \
                && export UV_NO_PROGRESS=1 \
                && export UV_SYSTEM_PYTHON=1 \
                && pip install uv \
                && uv pip install huggingface_hub \
                && uv pip list"
            displayName: "HPU Env Setup"

          - script: |
              docker exec $(CONTAINER_NAME) \
              bash -c "cd /auto-round/.azure-pipelines/scripts/performance \
                && bash perf_test.sh --model_name=$(model_name) --scheme=$(scheme)"
            displayName: "Run performance test"

          - task: Bash@3
            condition: always()
            inputs:
              targetType: "inline"
              script: |
                docker stop $(CONTAINER_NAME)
                docker rm -vf $(CONTAINER_NAME) || true
            displayName: "Docker clean up"
