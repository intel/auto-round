trigger: none

pr:
  autoCancel: true
  drafts: false
  branches:
    include:
      - main
  paths:
    include:
      - auto_round
      - auto_round_extension
      - test/unit/test_hpu
      - setup.py
      - requirements-hpu.txt
      - .azure-pipelines/scripts/ut/run_ut_hpu.sh
      - .azure-pipelines/scripts/ut/detect_changed_tests.sh
      - .azure-pipelines/template/docker-template.yml
      - .azure-pipelines/template/ut-template.yml
    exclude:
      - auto_round/export/export_to_autogptq
      - auto_round/export/export_to_awq
      - auto_round_extension/ark
      - "*.md"
      - "**/*.md"

pool: GAUDI

variables:
  UPLOAD_PATH: $(Build.SourcesDirectory)/log_dir
  DOWNLOAD_PATH: $(Build.SourcesDirectory)/log_dir
  ARTIFACT_NAME: "UT_coverage_report"
  REPO: $(Build.Repository.Uri)

stages:
  - stage: Unit_test
    displayName: Unit Test
    dependsOn: []
    jobs:
      - job:
        displayName: Unit Test
        steps:
          - template: template/ut-template.yml
            parameters:
              imageSource: "pull"
              dockerConfigName: "commonDockerConfig"
              utScriptFileName: "run_ut_hpu"
              uploadPath: $(UPLOAD_PATH)
              utArtifact: "ut"
              filterChangedTests: true

          - task: UseDotNet@2
            displayName: 'Use .NET Core sdk 7.0.x'
            inputs:
              version: 7.0.x

          - task: PublishCodeCoverageResults@2
            condition: ne(variables['HAS_COVERAGE'], 'false')
            inputs:
              summaryFileLocation: $(UPLOAD_PATH)/coverage.xml
              # coverage.xml is produced inside the container, where the checkout
              # lives at /auto-round, so its <sources> root does not exist on the
              # agent. Point the task at the agent-side checkout instead.
              pathToSources: $(Build.SourcesDirectory)
