name: Close stale issues and pull requests

permissions:
  contents: read
  issues: write
  pull-requests: write

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          start-date: '2024-01-01T00:00:00Z'
          operations-per-run: 500

          days-before-issue-stale: 60
          days-before-issue-close: 21
          stale-issue-message: >
            This issue is marked stale after 60 days of inactivity and will be
            closed in 21 days unless there is new activity.
          close-issue-message: >
            Closed due to inactivity. Feel free to reopen if still relevant.

          days-before-pr-stale: 60
          days-before-pr-close: 21
          stale-pr-message: >
            This PR is marked stale after 60 days of inactivity and will be
            closed in 21 days unless there is new activity.
          close-pr-message: >
            Closed due to inactivity. Feel free to reopen if still relevant.
