name: ARK CPU SDPA

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
    paths:
      - "auto_round_extension/ark/**"
      - ".github/workflows/ark_cpu_sdpa.yml"
      - "!**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu-sdpa:
    name: CPU SDPA (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest py-cpuinfo
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake build-essential g++

      - name: Build ARK CPU extension
        working-directory: auto_round_extension/ark
        run: |
          cmake -S auto_round_kernel -B build-cpu -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cpu -j"$(nproc)"
          cp build-cpu/auto_round_kernel_cpu*.so auto_round_kernel/

      - name: Print route status
        working-directory: auto_round_extension/ark
        run: python test/validate_non_int8_cpu_sdpa.py

      - name: Run CPU SDPA tests
        working-directory: auto_round_extension/ark
        run: |
          echo "=== Public CPU SDPA suite ==="
          python -m pytest test/test_ark_cpu_sdpa.py -v --tb=short

      - name: Run CPU mixed SDPA tests
        working-directory: auto_round_extension/ark
        run: |
          echo "=== Mixed-dtype CPU SDPA suite ==="
          python -m pytest test/test_ark_cpu_mixed_bestla_sdpa.py -v --tb=short

      - name: Run CPU SDPA benchmark (smoke)
        working-directory: auto_round_extension/ark
        run: |
          echo "=== CPU SDPA benchmark smoke ==="
          python test/bench_ark_cpu_sdpa.py --dtype float32 --shape decode --warmup 1 --runs 2
